<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相馬牧場 売上・出荷管理</title>
<style>
  :root{
    --ink:#1a2e35; --bg:#f6f4ee; --card:#fff; --line:#e2ddd0;
    --accent:#3d7068; --soft:#e8f0ec; --gold:#c08a2d; --sub:#7c8a86; --danger:#a8432f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;min-height:100vh;}

  /* ── ログイン ── */
  #login{max-width:380px;margin:0 auto;padding:60px 20px;}
  #login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;}
  #login .brand{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;}
  #login h1{font-size:19px;margin:4px 0 22px;}
  #login .err{color:var(--danger);font-size:13px;margin-top:10px;display:none;}

  header{padding:18px 16px 12px;border-bottom:2px solid var(--accent);background:var(--card);position:relative;}
  .brand{font-size:11px;letter-spacing:3px;color:var(--accent);font-weight:700;}
  .title{font-size:19px;font-weight:800;margin-top:2px;}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:20px;padding:2px 10px;margin-top:6px;}
  .who{position:absolute;top:18px;right:16px;font-size:11px;color:var(--sub);text-align:right;}
  .who button{margin-top:4px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer;color:var(--sub);}

  nav{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  nav button{flex:1;padding:13px 4px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;}
  nav button.on{font-weight:800;color:var(--accent);border-bottom:3px solid var(--accent);}
  main{padding:18px 16px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .card h3{font-size:14px;font-weight:800;margin:0 0 12px;}
  label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600;}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fcfbf8;}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;}
  .btn.sub{background:var(--card);color:var(--accent);border:1px solid var(--accent);}
  .seg{display:flex;gap:6px;margin-bottom:12px;}
  .seg button{flex:1;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .cust{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 6px;}
  .money{width:92px;text-align:right;font-size:13px;color:var(--sub);}
  .tot{border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;font-weight:800;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{padding:6px 4px;font-size:12px;font-weight:600;color:var(--sub);text-align:left;}
  td{padding:8px 4px;border-top:1px solid var(--line);}
  .stats{display:flex;gap:12px;margin-bottom:14px;}
  .stat{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 10px;background:var(--card);}
  .stat.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
  .stat .k{font-size:11px;opacity:.8;} .stat .v{font-size:17px;font-weight:800;margin-top:3px;}
  .del{border:none;background:none;color:var(--danger);cursor:pointer;font-size:18px;}
  .note{font-size:12px;color:var(--sub);margin-top:8px;}
  .right{text-align:right;} .center{text-align:center;}

  /* ── 帳票（納品書・請求書） ── */
  .sheet{background:#fff;border:1px solid var(--line);border-radius:4px;padding:28px 26px;
    font-family:'Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;color:#111;font-size:12px;}
  .sheet .dtitle{text-align:center;font-size:24px;font-weight:700;letter-spacing:12px;margin:0 0 20px;}
  .sheet .hdr{display:flex;justify-content:flex-end;margin-bottom:14px;}
  .sheet .hdr table{border-collapse:collapse;font-size:11px;}
  .sheet .hdr td{border:1px solid #999;padding:4px 10px;}
  .sheet .hdr td.k{background:#f2f1ec;font-weight:700;text-align:right;white-space:nowrap;}
  .sheet .hdr td.v{text-align:center;min-width:120px;}
  .sheet .meta{display:flex;justify-content:space-between;gap:24px;margin-bottom:16px;}
  .sheet .to{flex:1;}
  .sheet .to .nm{font-size:15px;font-weight:700;border-bottom:1px solid #111;padding-bottom:6px;}
  .sheet .to .sbj{margin-top:14px;font-size:11px;}
  .sheet .from{min-width:250px;font-size:11px;line-height:1.85;}
  .sheet .from .co{font-size:14px;font-weight:700;}
  .sheet .from{position:relative;}
  .sheet .seal{position:absolute;right:4px;top:12px;width:58px;height:58px;opacity:.92;}
  .sheet .grand{border:2px solid #111;display:flex;align-items:stretch;margin:12px 0 10px;}
  .sheet .grand .lbl{flex:1;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;padding:10px;border-right:2px solid #111;}
  .sheet .grand .amt{width:46%;text-align:right;font-size:20px;font-weight:700;padding:10px 14px;}
  .sheet .due{font-size:11px;margin-bottom:14px;display:flex;justify-content:space-between;}
  .sheet table.items{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px;}
  .sheet table.items th{background:#e8efec;border:1px solid #999;padding:6px 4px;font-weight:700;text-align:center;}
  .sheet table.items td{border:1px solid #bbb;padding:6px 5px;}
  .sheet table.items td.n{text-align:right;}
  .sheet table.items td.c{text-align:center;}
  .sheet table.items tr.blank td{height:24px;}
  .sheet table.sum{margin-left:auto;width:300px;border-collapse:collapse;font-size:11px;}
  .sheet table.sum td{padding:5px 9px;border:1px solid #ccc;}
  .sheet table.sum td.k{background:#f7f6f2;text-align:right;}
  .sheet table.sum td.v{text-align:right;width:115px;}
  .sheet table.sum tr.fin td{border-top:2px solid #111;font-size:14px;font-weight:700;background:#fff;}
  .sheet .bank{margin-top:16px;border:1px solid #999;padding:10px 12px;font-size:11px;line-height:1.9;}
  .sheet .memo{margin-top:12px;border:1px solid #999;padding:8px 12px;font-size:11px;min-height:44px;}
  .sheet .memo b{font-size:11px;}
  .sheet table.sign{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
  .sheet table.sign th{background:#e8efec;border:1px solid #999;padding:6px 4px;font-weight:700;text-align:center;}
  .sheet table.sign td{border:1px solid #999;height:58px;vertical-align:middle;}
  .sheet table.sign td.c{text-align:center;}
  .sheet .signttl{font-size:11px;font-weight:700;margin-top:14px;}
  .sheet .rem{margin-top:12px;font-size:10.5px;color:#444;border-top:1px dashed #bbb;padding-top:8px;line-height:1.7;}

  @media print{
    body{background:#fff;}
    .no-print{display:none !important;}
    .wrap{max-width:none;}
    main{padding:0;}
    .card{border:none;padding:0;margin:0;background:#fff;}
    .sheet{border:none;border-radius:0;padding:0;}
    @page{size:A4;margin:16mm;}
  }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login">
  <div class="box">
    <div class="brand">SOMA FARM</div>
    <h1>相馬牧場　売上・出荷管理</h1>

    <div id="stepLogin">
      <label>ユーザー名</label>
      <input id="lu" autocomplete="username" style="margin-bottom:12px">
      <label>パスワード</label>
      <input id="lp" type="password" autocomplete="current-password" style="margin-bottom:16px">
      <button class="btn" id="lbtn">ログイン</button>
      <div style="text-align:center;margin-top:14px">
        <a id="goSetup" href="#" style="font-size:13px;color:var(--accent);font-weight:700">初回ログインの方はこちら</a>
      </div>
      <div style="text-align:center;margin-top:10px;font-size:11px;color:var(--sub)">
        パスワードをお忘れの場合は、管理者にご連絡ください。
      </div>
    </div>

    <div id="stepSetup" style="display:none">
      <div style="background:var(--soft);border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;line-height:1.7">
        <b id="setupWho"></b> さんの初回ログインです。<br>
        これから使うパスワードを決めてください。
      </div>
      <label>新しいパスワード（6文字以上）</label>
      <input id="np1" type="password" autocomplete="new-password" style="margin-bottom:12px">
      <label>もう一度入力</label>
      <input id="np2" type="password" autocomplete="new-password" style="margin-bottom:16px">
      <button class="btn" id="sbtn">パスワードを設定してはじめる</button>
      <button class="btn sub" id="cbtn" style="margin-top:8px">もどる</button>
    </div>

    <div class="err" id="lerr"></div>
  </div>
</div>

<!-- アプリ本体 -->
<div class="wrap" id="app" style="display:none">
  <header class="no-print">
    <div class="brand">SOMA FARM</div>
    <div class="title">相馬牧場　売上・出荷管理</div>
    <span id="badge" class="badge"></span>
    <div class="who"><span id="whoami"></span><br><button id="logout">ログアウト</button></div>
  </header>
  <nav id="nav" class="no-print"></nav>
  <main id="main"></main>
</div>

<script>
const PRESET_PRODUCTS = [{"id": "p001", "customer": "道の駅182ステーション", "item": "TG", "price": 1500}, {"id": "p002", "customer": "道の駅182ステーション", "item": "ヨーグルト", "price": 590}, {"id": "p003", "customer": "道の駅182ステーション", "item": "牛乳 200ml", "price": 196}, {"id": "p004", "customer": "道の駅182ステーション", "item": "牛乳 900ml", "price": 661}, {"id": "p005", "customer": "道の駅182ステーション", "item": "飲むヨーグルト 200ml", "price": 251}, {"id": "p006", "customer": "道の駅182ステーション", "item": "飲むヨーグルト 900ml", "price": 771}, {"id": "p007", "customer": "道の駅182ステーション", "item": "【廃棄】ヨーグルト", "price": -226}, {"id": "p008", "customer": "道の駅182ステーション", "item": "【廃棄】牛乳 200ml", "price": -97}, {"id": "p009", "customer": "道の駅182ステーション", "item": "【廃棄】牛乳 900ml", "price": -351}, {"id": "p010", "customer": "道の駅182ステーション", "item": "【廃棄】飲むヨーグルト 200ml", "price": -105}, {"id": "p011", "customer": "道の駅182ステーション", "item": "【廃棄】飲むヨーグルト 900ml", "price": -345}, {"id": "p012", "customer": "道の駅182（カフェ）", "item": "牛乳 900ml", "price": 714}, {"id": "p013", "customer": "れいこう堂", "item": "牛乳９００", "price": 640}, {"id": "p014", "customer": "れいこう堂", "item": "牛乳２００", "price": 200}, {"id": "p015", "customer": "れいこう堂", "item": "飲むヨーグルト850", "price": 784}, {"id": "p016", "customer": "れいこう堂", "item": "飲むヨーグルト200", "price": 240}, {"id": "p017", "customer": "れいこう堂", "item": "ヨーグルト", "price": 560}, {"id": "p018", "customer": "IKO", "item": "牛乳", "price": 560}, {"id": "p019", "customer": "IKO", "item": "飲むヨーグルト", "price": 210}, {"id": "p020", "customer": "IKO", "item": "ヨーグルト", "price": 490}, {"id": "p021", "customer": "IKO", "item": "プリン", "price": 266}, {"id": "p022", "customer": "IKO", "item": "ソフトミックス", "price": 1600}, {"id": "p023", "customer": "LOG", "item": "牛乳", "price": 350}, {"id": "p024", "customer": "LOG", "item": "容器", "price": 500}, {"id": "p025", "customer": "【U2】ヤードカフェ", "item": "牛乳", "price": 350}, {"id": "p026", "customer": "【U2】ヤードカフェ", "item": "容器", "price": 1000}, {"id": "p027", "customer": "【U2】ヤードカフェ", "item": "ヨーグルト", "p const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const S = { user:'', pw:'', tab:'input', period:'day', anchor:today(),
            products:[], records:[], payments:{}, busy:false, mode:'' };

function today(){ return new Date().toISOString().slice(0,10); }
function yen(n){ return '¥'+Math.round(n||0).toLocaleString('ja-JP'); }
function num(n){ return Math.round(n||0).toLocaleString('ja-JP'); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function groupBy(ps){ const g={}; ps.forEach(p=>{(g[p.customer]=g[p.customer]||[]).push(p);}); return g; }
function jpDate(s){ if(!s) return ''; const [y,m,d]=s.split('-'); return `${y}年${+m}月${+d}日`; }
function jpMonth(s){ const [y,m]=s.split('-'); return `${y}年${+m}月`; }

async function apiLoad(){
  const u = GAS_URL+'?action=load&user='+encodeURIComponent(S.user)+'&pw='+encodeURIComponent(S.pw);
  const r = await fetch(u); return r.json();
}
async function apiPost(payload){
  const body = Object.assign({user:S.user, pw:S.pw}, payload);
  const r = await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  return r.json();
}

// ── ログイン ──
document.getElementById('lbtn').onclick = doLogin;
document.getElementById('sbtn').onclick = doSetup;
document.getElementById('cbtn').onclick = ()=>{ showStep('login'); };
document.getElementById('goSetup').onclick = (e)=>{
  e.preventDefault();
  const u=document.getElementById('lu').value.trim();
  if(!u){ showErr('先に上のユーザー名を入力してから押してください。'); return; }
  S.user=u;
  document.getElementById('setupWho').textContent=u;
  showStep('setup');
};
document.getElementById('lp').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('np2').addEventListener('keydown',e=>{ if(e.key==='Enter') doSetup(); });

function showStep(which){
  document.getElementById('stepLogin').style.display = which==='login'?'block':'none';
  document.getElementById('stepSetup').style.display = which==='setup'?'block':'none';
  document.getElementById('lerr').style.display='none';
}
function showErr(msg){
  const e=document.getElementById('lerr'); e.textContent=msg; e.style.display='block';
}

async function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  const btn=document.getElementById('lbtn');
  if(!u||!p){ showErr('ユーザー名とパスワードを入力してください。'); return; }
  btn.textContent='確認中…'; btn.disabled=true;
  S.user=u; S.pw=p;
  try{
    const d = await apiLoad();
    if(d && d.ok){
      LS.set('auth',{u,p});
      S.products=d.products||[]; S.records=d.records||[]; S.payments=d.payments||{};
      showApp();
    }else if(d && d.error==='setup'){
      document.getElementById('setupWho').textContent=u;
      showStep('setup');
    }else if(d && d.error==='nouser'){
      showErr('そのユーザー名は登録されていません。管理者にご確認ください。');
    }else{
      showErr('パスワードが違います。');
    }
  }catch(e){ showErr('接続できませんでした。通信環境をご確認ください。'); }
  btn.textContent='ログイン'; btn.disabled=false;
}

async function doSetup(){
  const a=document.getElementById('np1').value, b=document.getElementById('np2').value;
  const btn=document.getElementById('sbtn');
  if(a.length<6){ showErr('パスワードは6文字以上にしてください。'); return; }
  if(a!==b){ showErr('2つのパスワードが一致しません。'); return; }
  btn.textContent='設定中…'; btn.disabled=true;
  try{
    const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'setupPassword',user:S.user,newPw:a})});
    const d=await r.json();
    if(d && d.ok){
      S.pw=a;
      const d2=await apiLoad();
      if(d2 && d2.ok){
        LS.set('auth',{u:S.user,p:a});
        S.products=d2.products||[]; S.records=d2.records||[]; S.payments=d2.payments||{};
        showApp();
      }else showErr('設定はできましたが、読み込みに失敗しました。もう一度ログインしてください。');
    }else if(d && d.error==='already'){
      showErr('このユーザーはすでにパスワードが設定されています。');
      showStep('login');

function docLines(cust,month,byDate){
  const recs=S.records.filter(r=>r.date.slice(0,7)===month).sort((a,b)=>a.date.localeCompare(b.date));
  const mine=S.products.filter(p=>p.customer===cust);
  if(byDate){
    const out=[];
    recs.forEach(r=>mine.forEach(p=>{const q=Number(r.sales?.[p.id])||0;if(!q)return;
      out.push({date:r.date,item:p.item,qty:q,price:p.price,total:q*p.price});}));
    return out;
  }
  const map={};
  recs.forEach(r=>mine.forEach(p=>{const q=Number(r.sales?.[p.id])||0;if(!q)return;
    if(!map[p.id])map[p.id]={item:p.item,price:p.price,qty:0};map[p.id].qty+=q;}));
  return Object.values(map).map(x=>({...x,total:x.qty*x.price}));
}

function normKey(t){
  return String(t==null?'':t)
    .replace(/[\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]/g,
      function(c){ return String.fromCharCode(c.charCodeAt(0)-0xFEE0); })
    .replace(/[\s\u3000]/g,'');
}
const RENAMES=[
  {from:{customer:'TLB'},                      to:{customer:'LOG'}},
  {from:{customer:'TLB（Log）'},               to:{customer:'LOG'}},
  {from:{customer:'道の駅１８２',item:'TG'},   to:{customer:'道の駅182ステーション',item:'TG'}},
  {from:{customer:'道の駅１８２',item:'牛乳'}, to:{customer:'道の駅182（カフェ）',item:'牛乳 900ml'}},
  {from:{customer:'道の駅182ステーション',item:'牛乳'}, to:{customer:'道の駅182（カフェ）',item:'牛乳 900ml'}},
];
function applyRenames(p){
  var q={id:p.id,customer:p.customer,item:p.item,price:p.price};
  RENAMES.forEach(function(r){
    var okC=(r.from.customer===undefined)||(normKey(q.customer)===normKey(r.from.customer));
    var okI=(r.from.item===undefined)||(normKey(q.item)===normKey(r.from.item));
    if(okC&&okI){
      if(r.to.customer!==undefined) q.customer=r.to.customer;
      if(r.to.item!==undefined)     q.item=r.to.item;
    }
  });
  return q;
}
function mergeProducts(current, preset){
  var cur=(current||[]).map(function(p){var r=applyRenames(p);return {orig:p,key:normKey(r.customer)+'|#|'+normKey(r.item),ren:r};});
  var used={}, maxN=0;
  cur.forEach(function(c){var m=/^p(\d+)$/.exec(c.orig.id||''); if(m) maxN=Math.max(maxN,parseInt(m[1],10));});
  var out=[], kept=0, added=0;
  preset.forEach(function(p){
    var key=normKey(p.customer)+'|#|'+normKey(p.item);
    var hit=null;
    for(var i=0;i<cur.length;i++){ if(cur[i].key===key && !used[cur[i].orig.id]){ hit=cur[i]; break; } }
    if(hit){ used[hit.orig.id]=1; kept++; out.push({id:hit.orig.id,customer:p.customer,item:p.item,price:p.price}); }
    else { maxN++; added++; out.push({id:'p'+String(maxN).padStart(3,'0'),customer:p.customer,item:p.item,price:p.price}); }
  });
  var orphan=0;
  cur.forEach(function(c){
    if(used[c.orig.id]) return;
    orphan++;
    out.push({id:c.orig.id,customer:c.ren.customer,item:c.ren.item,price:c.orig.price});
  });
  return {list:out,kept:kept,added:added,orphan:orphan};
}

}

function nowLocal(){ const d=new Date();

      <th>品名</th><th style="width:56px">数量</th><th style="width:74px">単価</th>
      <th style="width:92px">金額</th><th style="width:50px">税率</th></tr></thead><tbody>`;
    lines.forEach(l=>{
      h+=`<tr>
        <td>${l.item}${l.rate===0.08?' ※':''}</td><td class="n">${num(l.qty)}</td>
        <td class="n">${num(l.price)}</td><td class="n">${num(l.total)}</td>
        <td class="c">${l.rate===0.08?'8%':'10%'}</td></tr>`;
    });
    const blanks=Math.max(0,3-lines.length);
    for(let i=0;i<blanks;i++) h+=`<tr class="blank"><td colspan="5"></td></tr>`;
    h+=`</tbody></table>
      <table class="sum">
        <tr><td class="k">8%対象　小計（税抜）</td><td class="v">${yen(sub8)}</td></tr>
        <tr><td class="k">　　　　消費税（8%）</td><td class="v">${yen(tax8)}</td></tr>
        <tr><td class="k">10%対象 小計（税抜）</td><td class="v">${yen(sub10)}</td></tr>
        <tr><td class="k">　　　　消費税（10%）</td><td class="v">${yen(tax10)}</td></tr>
        <tr class="fin"><td class="k">${isInv?'ご請求金額（税込）':'合計金額（税込）'}</td><td class="v">${yen(total)}</td></tr>
      </table>`;
  }

  if(isInv){
    h+=`<div class="bank"><b>お振込先</b><br>
      金融機関：GMOあおぞらネット銀行　　支店：法人第二営業部(102)<br>
      預金種別：普通　　口座番号：2525103<br>
      口座名義：カ）ソウマボクジョウ<br>
      ※ 振込手数料は貴社にてご負担願います。</div>`;
  }
  h+=`<div class="memo"><b>備考</b></div>`;
  if(!isInv){
    h+=`<div class="signttl">受領確認欄</div>
      <table class="sign">
        <tr><th style="width:34%">受領日</th><th>御署名（または受領印）</th></tr>
        <tr><td class="c" style="color:#888">　　　年　　月　　日</td><td></td></tr>
      </table>
      <div style="font-size:10px;color:#444;margin-top:5px">※ 商品をお受け取りいただきましたら、受領日のご記入と御署名（または受領印）をお願いいたします。</div>`;
  }
  h+=`<div class="rem">※ 「※」印は軽減税率（8%）対象の飲食料品です。<br>
      ※ 消費税は税率ごとに区分して計算し、端数は切捨てとしています。</div>`;
  h+=`</div></div>`;
  m.innerHTML=h;

  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S._dk=b.dataset.k;render();});
  document.getElementById('dc').onchange=e=>{S._dc=e.target.value;render();};
  const dmEl=document.getElementById('dm'); if(dmEl) dmEl.onchange=e=>{S._dm=e.target.value;render();};
  const ddEl=document.getElementById('dd'); if(ddEl) ddEl.onchange=e=>{S._dd=e.target.value;render();};
  document.getElementById('dt').onchange=e=>{S._dt=e.target.value+'T09:00';render();};
  const sqEl=document.getElementById('sq');
  if(sqEl) sqEl.onchange=e=>{
    const v=Math.max(1,parseInt(e.target.value,10)||1);
    S._seq[seqKey]=v; LS.set(seqKey,v); render();
  };
  document.getElementById('pr').onclick=()=>{
    window.print();
    S._seq[seqKey]=seq+1; LS.set(seqKey,seq+1);
    setTimeout(render,600);
  };
}

function vPay(m){
  const month=S._pm||today().slice(0,7);
  const custs=[...new Set(S.products.map(p=>p.customer))];
  let h=`<div class="card"><h3>入金確認</h3><label>対象月</label><input type="month" id="pm" value="${month}"></div>`;
  h+=`<div class="card"><table><thead><tr><th>販売先</th><th class="right">請求額</th><th class="center">状況</th></tr></thead><tbody>`;
  let any=false;
  custs.forEach(c=>{
    const l=docLines(c,month,false).map(x=>Object.assign({},x,{rate:taxRate(x.item)}));
    const s8=l.filter(x=>x.rate===0.08).reduce((a,x)=>a+x.total,0);
    const s10=l.filter(x=>x.rate===0.10).reduce((a,x)=>a+x.total,0);
    const sub=s8+s10;
    const billed=s8+Math.floor(s8*0.08)+s10+Math.floor(s10*0.10);
    if(!sub) return; any=true;
    const key=c+'|'+month; const st=S.payments[key]?.status||'未入金';
    const paid=st==='入金済';
    h+=`<tr><td>${c}</td><td class="right">${yen(billed)}</td>
      <td class="center"><button data-key="${key}" data-next="${paid?'未入金':'入金済'}"
      style="border:1px solid ${paid?'var(--accent)':'var(--line)'};background:${paid?'var(--accent)':'var(--card)'};
      color:${paid?'#fff':'var(--sub)'};border-radius:14px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer">
      ${st}</button></td></tr>`;
  });
  if(!any) h+=`<tr><td colspan="3" style="color:var(--sub);font-size:13px;padding:14px 4px">この月の請求はありません。</td></tr>`;
  h+=`</tbody></table><div class="note">状況のボタンを押すと「未入金 / 入金済」が切り替わり、スプレッドシートに保存されます。</div></div>`;
  m.innerHTML=h;
  document.getElementById('pm').onchange=e=>{S._pm=e.target.value;render();};
  m.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
    savePayment(b.dataset.key,b.dataset.next,b.dataset.next==='入金済'?today():'');
  });
}

function vSettings(m){
  const g=groupBy(S.products);
  let h=`<div class="card"><h3>販売先・商品ごとの単価</h3>
    <div class="note" style="margin-top:0;margin-bottom:12px">ここで登録した単価で金額を自動計算します。</div>`;
  for(const c in g){
    h+=`<p class="cust">${c}</p>`;
    g[c].forEach(p=>{
      h+=`<div class="row"><div style="flex:1;font-size:14px">${p.item}</div>
        <input type="number" class="pz" data-id="${p.id}" value="${p.price}" style="width:100px;flex:none;text-align:right">
        <span style="font-size:12px;color:var(--sub)">円</span>
        <button class="del" data-del="${p.id}">×</button></div>`;
    });
  }
  h+=`</div><div class="card"><h3>新しい商品を追加</h3>
    <label>販売先</label><input id="nc" placeholder="例：onomichi U2" style="margin-bottom:8px">
    <label>商品名</label><input id="ni" placeholder="例：牛乳" style="margin-bottom:8px">
    <label>単価（円／点）</label><input id="np" type="number" placeholder="例：270" style="margin-bottom:12px">
    <button class="btn" id="add">追加する</button></div>`;
  h+=`<div class="card"><h3>商品マスタの更新</h3>
    <div class="note" style="margin-top:0;margin-bottom:12px">最新の単価一覧（17取引先・66商品）に更新します。<b>入力済みの販売実績はそのまま残ります。</b></div>
    <button class="btn sub" id="imp">商品マスタを更新する</button></div>`;
  h+=`<div class="card"><h3>パスワードの変更</h3>
    <label>新しいパスワード（6文字以上）</label><input id="cp1" type="password" style="margin-bottom:8px">
    <label>もう一度入力</label><input id="cp2" type="password" style="margin-bottom:12px">
    <button class="btn sub" id="chg">パスワードを変更する</button></div>`;
  h+=`<div class="card"><h3>データの再読み込み</h3>
    <div class="note" style="margin-top:0;margin-bottom:12px">他の端末で入力した内容を取り込みます。</div>
    <button class="btn sub" id="rl">最新の内容を読み込む</button></div>`;
  m.innerHTML=h;
  m.querySelectorAll('.pz').forEach(i=>i.onblur=()=>saveProducts(S.products.map(p=>p.id===i.dataset.id?{...p,price:Number(i.value)||0}:p)));
  m.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>saveProducts(S.products.filter(p=>p.id!==b.dataset.del)));
  document.getElementById('add').onclick=()=>{
    const c=document.getElementById('nc').value,i=document.getElementById('ni').value,p=document.getElementById('np').value;
    if(!c||!i||!p) return;
    saveProducts([...S.products,{id:uid(),customer:c.trim(),item:i.trim(),price:Number(p)||0}]);
  };
  document.getElementById('rl').onclick=async()=>{ await reload(); render(); alert('読み込みました'); };
  document.getElementById('imp').onclick=async()=>{
    if(!confirm('商品マスタを最新の内容に更新します。入力済みの販売実績はそのまま残ります。よろしいですか？')) return;
    const r=mergeProducts(S.products, PRESET_PRODUCTS);
    await saveProducts(r.list);
    alert('更新しました。 引き継ぎ '+r.kept+'件 ／ 新規追加 '+r.added+'件 ／ 実績保持のため残した商品 '+r.orphan+'件');
  };
  document.getElementById('chg').onclick=async()=>{
    const a=document.getElementById('cp1').value, b=document.getElementById('cp2').value;
    if(a.length<6){ alert('パスワードは6文字以上にしてください。'); return; }
    if(a!==b){ alert('2つのパスワードが一致しません。'); return; }
    const d=await apiPost({action:'changePassword',newPw:a});
    if(d && d.ok){ S.pw=a; LS.set('auth',{u:S.user,p:a}); alert('変更しました。'); render(); }
    else alert('変更できませんでした。');
  };
}
</script>
